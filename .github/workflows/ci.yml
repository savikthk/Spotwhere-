name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  python:
    name: Python pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile scripts
        run: python -m py_compile fetch_venues.py enrich_venues.py load_to_db.py

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Check JS syntax
        run: node --check frontend/app.js

  backend:
    name: C++ backend build
    runs-on: ubuntu-latest
    container: drogonframework/drogon:latest
    steps:
      - uses: actions/checkout@v5
      - name: Dependencies (libpq, curl)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libpq-dev libcurl4-openssl-dev cmake g++
      - name: Build
        working-directory: backend
        run: |
          cmake -B build
          cmake --build build
